name: ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev deps
        run: pip install -e ".[dev]"

      - name: Pytest
        run: PYTHONPATH=. python -m pytest -ra

      - name: Bench (signal-preservation invariant)
        # Falls back to tests/fixtures/scrubbed automatically; raw isn't
        # checked into the repo. The script exits non-zero if the hard
        # invariant (every signal user msg verbatim in brief) ever fails.
        run: PYTHONPATH=. python scripts/bench.py
